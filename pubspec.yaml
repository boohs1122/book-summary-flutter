name: booksummary
description: "Book photo summary and quiz app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  dio: ^5.11.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.10.1
  image_picker: ^1.2.3
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  fonts:
    - family: StudySans
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
